version: "3.9"
services:
  traefik:
    image: "traefik:v3.3"
    container_name: "sq_traefik"
    command:
      - "--api.insecure=true"
      - "--providers.file=true"
      - "--providers.file.filename=/config/traefik.yml"
      - "--entrypoints.web.address=:80"
      - "--entryPoints.web.proxyProtocol.insecure"
      - "--entryPoints.web.forwardedHeaders.insecure"
    restart: always
    ports:
      - "80:80"
      # Traefik dashboard/API runs with --api.insecure=true (no auth):
      # keep it on loopback so it is not exposed to the network.
      - "127.0.0.1:8080:8080"
    volumes:
      # File provider only (--providers.file): no docker.sock mount needed.
      - ./traefik.yml:/config/traefik.yml
#  nginx:
#    image: "nginx:latest"
#    container_name: "sq_nginx"
#    restart: always
#    ports:
#      - "80:80"
#    volumes:
#      - ./nginx.conf:/etc/nginx/nginx.conf
  database:
    container_name: sq_mongodb
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./data:/data/db
  api:
    container_name: sq_api
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    # Optional Sentry reporting (passthrough; unset by default, see
    # docker-compose.yml). Never baked into the image.
    environment:
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - type: bind
        source: ./config.js
        target: /sqtracker/config.js
        read_only: true
    depends_on:
      - database
  client:
    container_name: sq_client
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ./config.js
        target: /sqtracker/config.js
        read_only: true
    depends_on:
      - api

