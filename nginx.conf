events {}

http {
  # Don't advertise the nginx version on error responses.
  server_tokens off;

  server {
    listen 80;
    resolver 127.0.0.11;

    # Baseline hardening headers on every proxied response. HSTS is
    # intentionally set at the TLS edge (Traefik), not here on plain HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    # Conservative CSP baseline, mirrored from client/next.config.ts. Served
    # as Report-Only (not enforcing): Next.js hydration needs inline scripts,
    # so a static `script-src 'self'` would break it — see the TODO in
    # next.config.ts about a per-request nonce follow-up. If the deployment's
    # API URL is off-origin, extend connect-src with that origin.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:3001 http://127.0.0.1:3001; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
      proxy_pass http://sq_client:3000;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }

    location /api/ {
      rewrite /api/(.*) /$1 break;
      proxy_pass http://sq_api:3001;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }

    location = /rss {
      proxy_pass http://sq_api:3001;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }

    location /torrent/ {
      proxy_pass http://sq_api:3001;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }

    location = /config {
      proxy_pass http://sq_api:3001;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }

    location /plugins/ {
      proxy_pass http://sq_api:3001;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }

    location ~ ^/(register|login|reset-password|verify-email|user|account|announcements|reports|admin|requests|group|wiki|forum|messages|moderation|notifications)/ {
      proxy_pass http://sq_api:3001;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }

    location /announce/ {
      proxy_pass http://sq_api:3001;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }

    location /sq/ {
      proxy_pass http://sq_api:3001;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }
  }
}
