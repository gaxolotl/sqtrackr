http:
  routers:
    api:
      service: api
      entryPoints:
        - web
      rule: "Host(`example.com`) && PathPrefix(`/api`, `/sq`, `/announce`, `/rss`, `/torrent`, `/config`, `/register`, `/login`, `/reset-password`, `/verify-email`, `/user`, `/account`, `/announcements`, `/reports`, `/admin`, `/requests`, `/group`, `/wiki`, `/forum`, `/messages`, `/moderation`, `/notifications`, `/plugins`)"
      middlewares:
        - api-prefix
        - apiHostHeaderSet
        - secure-headers
      tls:
        certResolver: tlsresolver
    client:
      service: client
      entryPoints:
        - web
      rule: "Host(`example.com`) && PathPrefix(`/`)"
      middlewares:
        - clientHostHeaderSet
        - secure-headers
      tls:
        certResolver: tlsresolver
  services:
    api:
      loadBalancer:
        servers:
          - url: http://sq_api:3001
    client:
      loadBalancer:
        servers:
          - url: http://sq_client:3000
  middlewares:
    api-prefix:
      stripPrefix:
        prefixes:
          - /api
    # Baseline hardening headers. Referrer/Permissions policies ride along
    # as custom response headers for compatibility with older Traefik 2.x.
    secure-headers:
      headers:
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: true
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        customResponseHeaders:
          Referrer-Policy: "no-referrer"
          Permissions-Policy: "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    clientHostHeaderSet:
      headers:
        customRequestHeaders:
          Host: "sq_client"
    apiHostHeaderSet:
      headers:
        customRequestHeaders:
          Host: "sq_api"
