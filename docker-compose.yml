services:
  traefik:
    image: "traefik:v3.3"
    container_name: "sq_traefik"
    command:
      # Dashboard/API listener. Disabled by default in production; set
      # TRAEFIK_INSECURE_API=true in the shell environment for local
      # debugging only. The port below stays loopback-bound either way.
      - "--api.insecure=${TRAEFIK_INSECURE_API:-false}"
      - "--providers.file=true"
      - "--providers.file.filename=/config/traefik.yml"
      - "--entrypoints.webinsecure.address=:80"
      - "--entrypoints.web.address=:443"
      - "--entryPoints.web.proxyProtocol.insecure"
      - "--entryPoints.web.forwardedHeaders.insecure"
      - "--certificatesresolvers.tlsresolver.acme.email=email@example.com"
      - "--certificatesresolvers.tlsresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.tlsresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.tlsresolver.acme.httpchallenge.entrypoint=webinsecure"
    ports:
      - "80:80"
      - "443:443"
      # Traefik dashboard/API runs with --api.insecure=true (no auth):
      # keep it on loopback so it is not exposed to the network.
      - "127.0.0.1:8080:8080"
    volumes:
      # File provider only (--providers.file): no docker.sock mount needed.
      - ./letsencrypt:/letsencrypt
      - ./traefik.yml:/config/traefik.yml
#  nginx:
#    image: "nginx:latest"
#    container_name: "sq_nginx"
#    restart: always
#    ports:
#      - "80:80"
#    volumes:
#      - ./nginx.conf:/etc/nginx/nginx.conf
  database:
    container_name: sq_mongodb
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  api:
    container_name: sq_api
    image: ghcr.io/tdjsnelling/sqtracker-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    # Optional Sentry reporting. Leave SENTRY_DSN unset to run without it;
    # the value comes from the shell environment (or a .env file), never
    # from the image.
    environment:
      - SENTRY_DSN=${SENTRY_DSN:-}
    # Auth transport note: browser JWTs travel via the `Authorization: Bearer`
    # header only (client/lib/api.ts -> api/src/middleware/auth.js). RSS
    # cookies carry a username/password or RSS token, never the JWT. JWT
    # expiry is a hardcoded 7d in the API login/register handlers, not
    # configurable from here.
    # TODO(httpOnly-migration): move the browser session JWT into an
    # HttpOnly + Secure + SameSite cookie set by the API (with CSRF
    # protection and a localStorage compat window). Breaking change needing
    # a coordinated API + client release; left for the auth owner.
    volumes:
      - type: bind
        source: ./config.js
        target: /sqtracker/config.js
        read_only: true
    depends_on:
      database:
        condition: service_healthy
  client:
    container_name: sq_client
    image: ghcr.io/tdjsnelling/sqtracker-client:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ./config.js
        target: /sqtracker/config.js
        read_only: true
      # - ./favicon.png:/sqtracker/public/favicon.png
      # - ./favicon.ico:/sqtracker/public/favicon.ico
    depends_on:
      - api
